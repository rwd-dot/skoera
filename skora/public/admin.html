<!doctype html>
<html lang="fo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Skøra – fráboðanir</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌼</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Karla:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap wide">
  <header>
    <h1>Fráboðanir<small>Skøra í Føroyum</small></h1>
    <button class="linkbtn" id="logout" hidden>Rita út</button>
  </header>

  <section id="login" hidden style="max-width:420px">
    <div class="field">
      <label for="token"><span>Admin-lykil</span></label>
      <input type="password" id="token" autocomplete="current-password">
      <div class="hint">Lykilin er ADMIN_TOKEN, sum er settur í Cloudflare.</div>
    </div>
    <button class="primary" id="loginBtn">Rita inn</button>
    <div class="msg err" id="loginMsg"></div>
  </section>

  <section id="app" hidden>
    <div class="stats" id="stats"></div>
    <div class="toolbar">
      <select id="filter" aria-label="Filtur">
        <option value="">Allar</option><option value="nyggj">Nýggjar</option>
        <option value="kannad">Kannaðar</option><option value="burtur">Burturbeindar</option>
      </select>
      <button class="secondary" id="csv">Tak út sum CSV</button>
      <button class="secondary" id="reload">Dagfør</button>
    </div>
    <div class="grid">
      <div class="map" id="map"></div>
      <div id="list"></div>
    </div>
  </section>
</div>
<dialog id="big"><img alt="Stór mynd"></dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const STATUS = { nyggj: 'Nýggj', kannad: 'Kannað', burtur: 'Burturbeint' };
  const COLOR = { nyggj: '#E3C94B', kannad: '#8C9585', burtur: '#3F6B2E' };
  let token = '', reports = [], map, layer, markers = {};
  try{ token = localStorage.getItem('skora_admin') || ''; }catch{}

  const api = (path, opts = {}) => fetch(path, { ...opts, headers: { ...(opts.headers || {}), Authorization: 'Bearer ' + token } });
  const fmt = iso => new Date(iso).toLocaleString('da-DK', { day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });

  async function load(){
    const r = await api('/api/admin/reports');
    if (r.status === 401){ showLogin('Skeivur lykil.'); return false; }
    if (!r.ok){ $('list').innerHTML = '<div class="empty-list">Fráboðanir kundu ikki heintast.</div>'; return true; }
    reports = (await r.json()).reports; render(); return true;
  }
  function showLogin(err){
    $('login').hidden = false; $('app').hidden = true; $('logout').hidden = true;
    $('loginMsg').textContent = err || '';
  }
  async function start(){
    $('login').hidden = true; $('app').hidden = false; $('logout').hidden = false;
    if (!map){
      map = L.map('map').setView([62.05, -6.9], 8);
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map);
      layer = L.layerGroup().addTo(map);
    }
    if (await load()) setTimeout(() => map.invalidateSize(), 50);
  }
  $('loginBtn').onclick = () => {
    token = $('token').value.trim(); if (!token) return;
    try{ localStorage.setItem('skora_admin', token); }catch{}
    start();
  };
  $('token').onkeydown = e => { if (e.key === 'Enter') $('loginBtn').click(); };
  $('logout').onclick = () => { token = ''; try{ localStorage.removeItem('skora_admin'); }catch{} showLogin(); };
  $('reload').onclick = load;
  $('filter').onchange = render;

  function render(){
    const f = $('filter').value;
    const shown = f ? reports.filter(r => r.status === f) : reports;
    const n = s => reports.filter(r => r.status === s).length;
    $('stats').innerHTML = '';
    [['í alt', reports.length], ['nýggjar', n('nyggj')], ['kannaðar', n('kannad')], ['burturbeindar', n('burtur')]].forEach(([l, v]) => {
      const d = document.createElement('div'); const b = document.createElement('b'); b.textContent = v; d.append(b, l); $('stats').append(d);
    });

    layer.clearLayers(); markers = {};
    const pts = [];
    for (const r of shown){
      if (r.lat == null) continue;
      const m = L.circleMarker([r.lat, r.lon], { radius: 8, color: '#23291F', weight: 1.5, fillColor: COLOR[r.status] || COLOR.nyggj, fillOpacity: .95 })
        .bindTooltip((r.place || fmt(r.created_at)))
        .on('click', () => focus(r.id));
      m.addTo(layer); markers[r.id] = m; pts.push([r.lat, r.lon]);
    }
    if (pts.length) map.fitBounds(pts, { padding: [30, 30], maxZoom: 14 });

    const list = $('list'); list.innerHTML = '';
    if (!shown.length){ list.innerHTML = '<div class="empty-list">Eingin fráboðan her.</div>'; return; }
    for (const r of shown){
      const it = document.createElement('div'); it.className = 'item'; it.id = 'r-' + r.id;
      const img = document.createElement('img'); img.alt = 'Mynd'; img.loading = 'lazy'; img.src = '/photo/' + r.photo_key;
      img.onclick = () => { $('big').querySelector('img').src = img.src; $('big').showModal(); };
      const body = document.createElement('div');
      const top = document.createElement('div');
      const pill = document.createElement('span'); pill.className = 'pill ' + r.status; pill.textContent = STATUS[r.status] || r.status;
      const when = document.createElement('span'); when.className = 'when'; when.textContent = fmt(r.created_at);
      top.append(pill, when);
      const place = document.createElement('p'); place.style.fontWeight = '700';
      place.textContent = r.place || (r.lat != null ? `${r.lat.toFixed(5)}, ${r.lon.toFixed(5)}` : 'Ókendur staður');
      body.append(top, place);
      if (r.accuracy != null){ const a = document.createElement('div'); a.className = 'hint'; a.textContent = `GPS ±${r.accuracy} m`; body.append(a); }
      if (r.ai_name){ const a = document.createElement('p'); a.className = 'hint'; a.textContent = `AI: ${r.ai_name}${r.ai_latin ? ' (' + r.ai_latin + ')' : ''}, vissa ${r.ai_confidence || '–'}`; body.append(a); }
      if (r.description){ const d = document.createElement('p'); d.textContent = r.description; body.append(d); }

      const act = document.createElement('div'); act.className = 'actions';
      const sel = document.createElement('select'); sel.setAttribute('aria-label', 'Støða');
      for (const [k, v] of Object.entries(STATUS)){ const o = new Option(v, k); o.selected = r.status === k; sel.append(o); }
      sel.onchange = async () => {
        const res = await api('/api/admin/reports/' + r.id, { method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ status: sel.value }) });
        if (res.ok){ r.status = sel.value; render(); } else sel.value = r.status;
      };
      act.append(sel);
      if (r.lat != null){
        const a = document.createElement('a'); a.href = `https://www.google.com/maps?q=${r.lat},${r.lon}`; a.target = '_blank'; a.rel = 'noopener'; a.textContent = 'Google Maps';
        act.append(a);
      }
      const del = document.createElement('button'); del.className = 'del'; del.textContent = 'Strika';
      del.onclick = async () => {
        if (!confirm('Strika hesa fráboðanina og myndina? Tað kann ikki angrast.')) return;
        const res = await api('/api/admin/reports/' + r.id, { method: 'DELETE' });
        if (res.ok){ reports = reports.filter(x => x.id !== r.id); render(); }
      };
      act.append(del);
      body.append(act);
      it.append(img, body); list.append(it);
    }
  }
  function focus(id){
    document.querySelectorAll('.item.active').forEach(e => e.classList.remove('active'));
    const el = $('r-' + id); if (!el) return;
    el.classList.add('active'); el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  $('csv').onclick = () => {
    const esc = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
    const rows = [['dato','stoda','breidd','longd','neyvleiki_m','stadur','fragreiding','ai_planta','ai_latin','ai_vissa','mynd']]
      .concat(reports.map(r => [r.created_at, STATUS[r.status] || r.status, r.lat, r.lon, r.accuracy, r.place, r.description, r.ai_name, r.ai_latin, r.ai_confidence, location.origin + '/photo/' + r.photo_key]));
    const blob = new Blob(['\ufeff' + rows.map(r => r.map(esc).join(';')).join('\n')], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = `skora-frabodanir-${new Date().toISOString().slice(0,10)}.csv`; a.click();
  };

  token ? start() : showLogin();
})();
</script>
</body>
</html>
